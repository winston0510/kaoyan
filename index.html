<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>考研刷题</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var _d=localStorage.getItem('kaoyan_theme')==='dark'||(!localStorage.getItem('kaoyan_theme')&&matchMedia('(prefers-color-scheme: dark)').matches);if(_d)document.documentElement.setAttribute('data-theme','dark');var _tc=document.querySelector('meta[name="theme-color"]');if(_tc)_tc.setAttribute('content',_d?'#000000':'#FFFFFF');var _sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(_sb)_sb.setAttribute('content',_d?'black-translucent':'default')}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研刷题">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div class="app" id="app">
  <!-- Config Banner -->
  <div class="config-banner" id="configBanner">
    ⚠ 请先配置 Supabase 连接信息 <button onclick="switchPage('admin')">去设置</button>
  </div>

  <!-- ====== HOME PAGE ====== -->
  <div class="page active" id="page-home">
    <div class="topbar">
      <div class="tb-left"><button class="tb-btn" id="themeToggle" onclick="toggleTheme()">🌙</button></div>
      <div class="tb-center"><div class="topbar-title">考研刷题</div><div class="topbar-sub" id="homeSub"></div></div>
      <div class="tb-right"><button class="tb-btn" onclick="switchPage('admin')">⚙️</button></div>
    </div>
    <div class="today-stats" id="todayStats">
      <div class="today-stat"><div class="num" id="todayTotal">0</div><div class="lbl">今日刷题</div></div>
      <div class="today-stat"><div class="num text-success" id="todayCorrect">0</div><div class="lbl">正确</div></div>
      <div class="today-stat"><div class="num text-primary" id="todayRate">-</div><div class="lbl">正确率</div></div>
      <div class="today-stat"><div class="num text-primary" id="todayStreak">0</div><div class="lbl">连续打卡</div></div>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="搜索题目（如：极限、KVL、马原）" onkeydown="if(event.key==='Enter')doSearch()">
      <span class="search-icon" onclick="doSearch()">🔍</span>
    </div>
    <div class="search-result-list" id="searchResults" style="display:none"></div>
    <div id="subjectList"></div>
  </div>

  <!-- ====== SUBJECT PAGE (章节刷题, v3.9.0) ====== -->
  <div class="page" id="page-subject">
    <div class="topbar">
      <div class="tb-left"><button class="tb-btn" onclick="switchPage('home')">←</button></div>
      <div class="tb-center"><div class="topbar-title" id="subjectTitle">科目</div></div>
      <div class="tb-right"></div>
    </div>
    <div id="subjectContent"></div>
  </div>

  <!-- ====== QUIZ PAGE ====== -->
  <div class="page" id="page-quiz">
    <div class="topbar">
      <div class="tb-left"><button class="tb-btn" onclick="quitQuiz()">←</button></div>
      <div class="tb-center"><div class="topbar-title" id="quizTitle">刷题中</div></div>
      <div class="tb-right"><span class="tb-btn tb-text" id="quizProgress">0/0</span></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>
    <div id="quizContent"></div>
  </div>

  <!-- ====== FAVORITES PAGE ====== -->
  <div class="page" id="page-favorites">
    <div class="topbar">
      <div class="tb-left"></div>
      <div class="tb-center"><div class="topbar-title">我的收藏</div></div>
      <div class="tb-right"><button class="tb-btn tb-text" onclick="startFavQuiz()">开始作答</button></div>
    </div>
    <div class="filter-row" id="favFilter"></div>
    <div id="favList"></div>
    <div class="empty-state" id="favEmpty" style="display:none">
      <div class="empty-icon">⭐</div><div class="empty-title">暂无收藏</div><div class="empty-desc">刷题时点击题目旁的 ☆ 即可收藏</div>
    </div>
  </div>

  <!-- ====== WRONG BOOK PAGE ====== -->
  <div class="page" id="page-wrongbook">
    <div class="topbar">
      <div class="tb-left"></div>
      <div class="tb-center"><div class="topbar-title">错题本</div></div>
      <div class="tb-right"></div>
    </div>
    <div class="filter-row" id="wrongFilter"></div>
    <div id="wrongList"></div>
    <div class="empty-state" id="wrongEmpty" style="display:none">
      <div class="empty-icon">📝</div><div class="empty-title">错题本为空</div><div class="empty-desc">做错的题目会自动收录</div>
    </div>
  </div>

  <!-- ====== STATS PAGE ====== -->
  <div class="page" id="page-stats">
    <div class="topbar">
      <div class="tb-left"></div>
      <div class="tb-center"><div class="topbar-title">学习统计</div></div>
      <div class="tb-right"></div>
    </div>
    <div class="stats-overview" id="statsOverview"></div>
    <div class="block-head"><h3 class="block-title">本周趋势</h3><span class="h-chip" id="weekChip"></span></div>
    <div class="week-chart" id="weekChart"></div>
    <div class="block-head"><h3 class="block-title">各科目</h3><span class="h-chip" id="subjectChip"></span></div>
    <div id="subjectStats"></div>
  </div>

  <!-- ====== KNOWLEDGE PAGE (v4.0.0) ====== -->
  <div class="page" id="page-knowledge">
    <div class="topbar">
      <div class="tb-left"><button class="tb-btn" id="knowledgeTopBack" style="visibility:hidden">←</button></div>
      <div class="tb-center"><div class="topbar-title" id="knowledgeTopTitle">知识库</div></div>
      <div class="tb-right"><button class="tb-btn" onclick="switchPage('admin')">⚙️</button></div>
    </div>
    <div id="knowledgeContent"></div>
  </div>

  <!-- ====== ADMIN PAGE ====== -->
  <div class="page" id="page-admin">
    <div class="topbar">
      <div class="tb-left"><button class="tb-btn" onclick="switchPage('home')">←</button></div>
      <div class="tb-center"><div class="topbar-title">题库管理</div></div>
      <div class="tb-right"></div>
    </div>
    <div class="card">
      <h3 style="font-size:.9375rem;font-weight:700;margin-bottom:12px">Supabase 连接设置</h3>
      <div class="form-group"><label>Supabase URL</label><input type="text" id="supabaseUrl" placeholder="https://xxxxx.supabase.co"></div>
      <div class="form-group"><label>Supabase Anon Key</label><input type="text" id="supabaseKey" placeholder="eyJhbGciOi..."></div>
      <button class="btn btn-primary mt-8" onclick="saveConfig()">保存并连接</button>
      <button class="btn btn-outline mt-8" onclick="loadDemoData()" id="btnLoad
